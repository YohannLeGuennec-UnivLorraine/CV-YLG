<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} — Yohann Le Guennec</title>
    <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ page.excerpt | strip_html | normalize_whitespace | truncate: 160 | escape }}{% endif %}">
    <meta name="author" content="{{ page.author | default: 'Yohann Le Guennec' | escape }}">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#165d8f">
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <link rel="icon" type="image/png" sizes="64x64" href="{{ site.baseurl }}/assets/favicon.png">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ page.excerpt | strip_html | normalize_whitespace | truncate: 160 | escape }}{% endif %}">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/og-image.jpg">
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/site.css">
  </head>
  <body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <main class="page" id="contenu">
      <nav class="site-switcher" aria-label="Navigation principale">
        <a class="site-switcher__brand" href="{{ site.baseurl }}/">Yohann Le Guennec</a>
        <div class="site-switcher__links">
          <a href="{{ site.baseurl }}/">CV</a>
          <a class="is-active" href="{{ site.baseurl }}/blog/">Blog</a>
        </div>
      </nav>

      <article class="post">
        <header class="post-header">
          <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d/%m/%Y" }}</time>{% if page.author %} · {{ page.author | escape }}{% endif %}</p>
          <h1>{{ page.title | escape }}</h1>
          {% if page.description %}<p class="intro">{{ page.description | escape }}</p>{% endif %}
        </header>
        <div class="post-content">
          {{ content }}
        </div>
        <a class="back-link" href="{{ site.baseurl }}/blog/">← Toutes les publications</a>
      </article>
    </main>
  </body>
</html>
